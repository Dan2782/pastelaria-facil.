
name: Testes Pastelaria Facil

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar ferramentas de teste
        run: python -m pip install pytest pytest-cov

      - name: Executar testes com cobertura
        run: |
          python -m pytest test_pastelaria.py -v --cov=estoque --cov=vendas --cov=despesas --cov-report=term-missing
